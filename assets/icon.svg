<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#0d0f12"/>
  <!-- Decorative Glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00e6ff" stroke-width="4" opacity="0.15"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00e6ff" stroke-width="2" stroke-dasharray="8 8" opacity="0.25"/>
  
  <!-- Diagnostic Engine Outline + Pulse Wave -->
  <g transform="translate(106, 126)">
    <!-- Engine block representation in styling -->
    <path d="M60 90 H90 V60 H130 V90 H210 V60 H240 V90 H270 V150 H240 V200 H60 Z" fill="none" stroke="#00e6ff" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Engine Check Details -->
    <path d="M110 120 H190 M110 150 H190" stroke="#00e6ff" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Pulse waveform representing car health/heartbeat -->
  <path d="M120 280 H180 L200 210 L225 350 L250 250 L270 300 H390" fill="none" stroke="#39ff14" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
